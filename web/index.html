<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Asistente TUP</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23262c3a'/%3E%3Cpath d='M9 17l5 5 9-12' stroke='%23e0533f' stroke-width='3.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/estilo.css">
  <script>
    try { const t = localStorage.getItem('tema'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <header class="barra">
    <a href="#/" class="marca" aria-label="Ir al inicio">
      <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8"/><path d="M9 17l5 5 9-12"/></svg>
      Asistente TUP
    </a>
    <nav class="barra-acciones">
      <a href="#/campus" class="campus-chip" id="campus-chip" title="Campus activo: cambiar o agregar otro" hidden>
        <span class="campus-etiqueta">Campus</span>
        <strong id="campus-nombre">…</strong>
        <span aria-hidden="true">▾</span>
      </a>
      <a href="#/estado" class="estado-link" id="estado-link">
        <span class="punto" id="estado-punto" aria-hidden="true"></span>
        <span id="estado-texto">Revisando…</span>
      </a>
      <a href="#/ayuda" class="boton-texto">Ayuda</a>
      <button class="boton-texto" id="tema" type="button" aria-label="Cambiar entre modo claro y oscuro">Modo oscuro</button>
      <button class="boton-texto" id="apagar" type="button">Cerrar asistente</button>
    </nav>
  </header>

  <main id="vista" tabindex="-1"></main>

  <script src="/vendor/marked.min.js"></script>
  <script src="/vendor/purify.min.js"></script>
  <script src="/app.js"></script>
</body>
</html>
